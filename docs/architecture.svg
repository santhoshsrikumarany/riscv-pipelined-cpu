<text x="55" y="714" class="paneltitle" fill="#3c9dff">PIPELINE STAGES</text>
<g class="small"><text x="55" y="750" fill="#3c9dff">IF</text><text x="105" y="750">Fetch instruction</text><text x="55" y="786" fill="#39f5a0">ID</text><text x="105" y="786">Decode + read registers</text><text x="55" y="822" fill="#ffae35">EX</text><text x="105" y="822">ALU + branch comparison</text><text x="55" y="858" fill="#c18aff">MEM</text><text x="105" y="858">Load / store data</text><text x="55" y="894" fill="#28e8ff">WB</text><text x="105" y="894">Write result to rd</text></g>
<text x="425" y="714" class="paneltitle" fill="#39f5a0">HAZARD HANDLING</text><text x="425" y="751" class="label" fill="#4dff9a">Forwarding</text><text x="565" y="751" class="small">Prefer EX/MEM over MEM/WB;</text><text x="565" y="770" class="small">never forward a write to x0.</text><text x="425" y="803" class="label" fill="#b58aff">Load-use stall</text><text x="565" y="803" class="small">Hold PC and IF/ID; zero ID/EX</text><text x="565" y="822" class="small">controls to insert a bubble.</text><text x="425" y="855" class="label" fill="#ff6caa">Branch flush</text><text x="565" y="855" class="small">Clear wrong-path work when</text><text x="565" y="874" class="small">a branch is taken.</text><text x="425" y="907" font-size="10" fill="#8eb5d9">Conceptual layout — confirm wiring against rtl/cpu.v.</text>
<text x="885" y="714" class="paneltitle" fill="#c18aff">SUPPORTED INSTRUCTIONS</text><g class="small"><text x="895" y="751">• ADD</text><text x="895" y="780">• SUB</text><text x="895" y="809">• AND</text><text x="895" y="838">• OR</text><text x="1020" y="751">• ADDI</text><text x="1020" y="780">• LW</text><text x="1020" y="809">• SW</text><text x="1020" y="838">• BEQ</text></g><text x="885" y="890" class="small">RV32I subset</text><text x="885" y="909" class="small">Directed simulation tests</text>
